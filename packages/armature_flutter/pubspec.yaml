name: armature_flutter
description: >-
  Flutter integration for armature: ArmatureApp bootstrap, slot widgets, reactive
  providers, and a debug overlay.
version: 0.1.0
homepage: https://telchardev.github.io/armature
repository: https://github.com/telchardev/armature
issue_tracker: https://github.com/telchardev/armature/issues

topics:
  - flutter
  - framework
  - state-management
  - architecture
  - feature-based

environment:
  sdk: ^3.9.0
  flutter: '>=3.27.0'

resolution: workspace

dependencies:
  meta: ^1.17.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  armature: ^0.1.0
  armature_reactive: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  mockito: ^5.6.0
  build_runner: ^2.13.0
