name: armature
description: >-
  Feature-based app framework with dependency-graph resolution, reactive stores,
  typed ports (pipes / behaviors / slots), and tasks.
version: 0.1.0
homepage: https://github.com/telchardev/armature
repository: https://github.com/telchardev/armature
issue_tracker: https://github.com/telchardev/armature/issues

topics:
  - framework
  - architecture
  - state-management
  - feature-based
  - dependency-injection

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  meta: ^1.17.0
  test: ^1.30.0
  armature_graph: ^0.1.0
  armature_reactive: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  mockito: ^5.6.0
  build_runner: ^2.13.0
