name: armature_workspace
publish_to: none
repository: https://github.com/telchardev/armature

environment:
  sdk: ^3.9.0

workspace:
  - packages/armature
  - packages/armature_graph
  - packages/armature_reactive
  - packages/armature_flutter
  - examples/armature_example
  - shared/analyzer
  - website

dev_dependencies:
  melos: ^7.5.1

melos:
  name: armature

  command:
    bootstrap:
      usePubspecOverrides: true

    version:
      branch: main
      linkToCommits: true
      workspaceChangelog: true
      updateGitTagRefs: true
      message: 'chore(release): publish'

  scripts:
    lint:all:
      run: melos run analyze && melos run format
      description: Run all static analysis checks.

    clean:force:
      run: melos clean && melos exec -- flutter clean && melos bootstrap
      description: Run `flutter clean` for all packages.

    analyze:
      run: melos exec -- flutter analyze --fatal-infos
      description: Run `flutter analyze` for all packages.

    upgrade:
      run: melos exec -- flutter pub upgrade --major-versions
      description: Run `flutter upgrade` for all packages.

    outdated:
      run: melos exec -- flutter pub outdated
      description: Run `flutter outdated` for all packages.

    format:
      run: melos exec dart format .
      description: Run `dart format` for all packages.

    test:
      run: melos exec --dir-exists=test -- "flutter test"
      description: Run all Flutter tests in this project.

    publish:check:
      run: melos publish --yes
      description: Run publish check

    release:unreleased:
      run: |
        tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$tag" ]; then
          echo "No release tags yet — all commits are unreleased:"
          git log --oneline
        else
          echo "Commits since $tag (these drive the next melos version bumps):"
          git log "$tag..HEAD" --oneline
        fi
      description: |
        List conventional commits since the last release tag — these are
        what `melos version` will inspect to decide version bumps.
        Melos has no `--dry-run`; this is the closest preview.

    release:verify:
      run: melos run analyze && melos run test && melos publish
      description: |
        Full pre-release gate — runs analyze + test + `melos publish`
        (dry-run by default), the same sequence the release workflow
        executes in CI. Fails if any package's analyze, tests, or
        `dart pub publish --dry-run` would fail.
