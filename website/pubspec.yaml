name: armature_website
description: Interactive landing and documentation site for the Armature framework.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.19.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  web: ^1.1.0
  flutter_highlighter: ^0.1.1
  highlighter: ^0.1.1
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.5
  armature:
    path: ../packages/armature
  armature_flutter:
    path: ../packages/armature_flutter

dev_dependencies:
  shared_analyzer:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/examples/content/counter/counter_store.dart
    - lib/examples/content/counter/counter_widget.dart
    - lib/examples/content/todo_list/todo_store.dart
    - lib/examples/content/todo_list/todo_widget.dart
    - lib/examples/content/debounced_search/search_store.dart
    - lib/examples/content/debounced_search/search_widget.dart
    - lib/examples/content/feature_toggles/toggle_demo.dart
    - lib/examples/content/notes_app/notes_app_widget.dart
