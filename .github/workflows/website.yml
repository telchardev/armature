name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: website
        run: flutter pub get

      - name: Analyze
        working-directory: website
        run: flutter analyze --fatal-infos

      - name: Regenerate sitemap from docsTree / examplesTree
        working-directory: website
        run: dart run tool/generate_sitemap.dart

      - name: Build web
        working-directory: website
        # `--pwa-strategy=none` skips emitting the deprecated service
        # worker — we're a docs site, no offline-first needs, and it
        # shaves a bit off the build + avoids a stale-SW bug class.
        run: flutter build web --release --base-href /armature/ --pwa-strategy=none

      - name: SPA fallback — copy index.html to 404.html
        working-directory: website
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
